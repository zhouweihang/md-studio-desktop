name: 功能建议
description: 希望新增或调整的能力
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        MD-Studio 的定位是**本地优先**的 Markdown 编辑器：无账号、无云同步、断网可用。
        与这个定位冲突的建议（在线协作、云端存储等）通常不会被采纳，请先在正文说明为什么仍然必要。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景与当前的不便，而不是直接给方案
      placeholder: 我在写长文档时需要……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 界面上应该怎么用、快捷键、与其他功能的衔接
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现有功能里有没有绕法？为什么不够用？
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 编辑器与渲染
        - 工作区与搜索
        - 导出与打印
        - 主题与外观
        - 快捷键与命令
        - 打包与安装
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 issue，没有重复
          required: true
