name: Package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: md-studio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: md-studio/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  dist:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: md-studio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: md-studio/package-lock.json

      - run: npm ci

      # 签名材料全部来自仓库 secret / variable：配置了才签，没配置的克隆（fork、本地验证）
      # 照样能产出可用但未签名的安装包。分支逻辑写在这里，打包配置本身保持无状态。
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CSC_LINK:-}" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "未配置 MAC_CSC_LINK：macOS 产物未签名、未公证，Gatekeeper 会拦截。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "CSC_LINK=$MAC_CSC_LINK"
            echo "CSC_KEY_PASSWORD=${MAC_CSC_KEY_PASSWORD:-}"
            echo "SIGNING_EXPECTED=1"
          } >> "$GITHUB_ENV"
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            # notarytool 要从磁盘读 .p8，所以把 secret 落到 runner 的临时目录，文件名固定
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID:-}"
              echo "APPLE_API_ISSUER=${APPLE_API_ISSUER:-}"
              echo "NOTARIZED=1"
            } >> "$GITHUB_ENV"
            echo "签名方式：Developer ID + 公证（notarytool API key）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有 APPLE_API_KEY_P8：只签名、不公证，Gatekeeper 仍会警告。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${AZURE_SIGNING_ENDPOINT:-}" ] && [ -n "${AZURE_SIGNING_ACCOUNT:-}" ] && [ -n "${AZURE_SIGNING_PROFILE:-}" ] && [ -n "${AZURE_SIGNING_PUBLISHER:-}" ]; then
            {
              echo "AZURE_SIGNING_ENDPOINT=$AZURE_SIGNING_ENDPOINT"
              echo "AZURE_SIGNING_ACCOUNT=$AZURE_SIGNING_ACCOUNT"
              echo "AZURE_SIGNING_PROFILE=$AZURE_SIGNING_PROFILE"
              echo "AZURE_SIGNING_PUBLISHER=$AZURE_SIGNING_PUBLISHER"
              echo "AZURE_TENANT_ID=${AZURE_TENANT_ID:-}"
              echo "AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}"
              echo "AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}"
              echo "SIGNING_EXPECTED=1"
            } >> "$GITHUB_ENV"
            echo "签名方式：Azure Trusted Signing（$AZURE_SIGNING_PROFILE）" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${WINDOWS_CSC_LINK:-}" ]; then
            {
              echo "WIN_CSC_LINK=$WINDOWS_CSC_LINK"
              echo "WIN_CSC_KEY_PASSWORD=${WINDOWS_CSC_KEY_PASSWORD:-}"
              echo "SIGNING_EXPECTED=1"
            } >> "$GITHUB_ENV"
            echo "签名方式：.pfx 证书（WIN_CSC_LINK）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未配置 Windows 签名材料：产物会被 SmartScreen 标为未知发布者。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build installers
        run: npm run ${{ matrix.script }}

      - name: Verify Windows signatures
        if: runner.os == 'Windows' && env.SIGNING_EXPECTED == '1'
        shell: pwsh
        run: |
          $targets = @()
          $targets += Get-ChildItem -Path release -Filter *.exe -File
          $targets += Get-ChildItem -Path release/win-unpacked -Filter *.exe -File -ErrorAction SilentlyContinue
          if ($targets.Count -eq 0) { throw "release 下没有可校验的 .exe" }
          $failed = @()
          foreach ($file in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Host ("{0} => {1} / {2}" -f $file.Name, $signature.Status, $signature.SignerCertificate.Subject)
            if ($signature.Status -ne 'Valid') { $failed += $file.FullName }
          }
          if ($failed.Count -gt 0) { throw "签名无效：`n$($failed -join "`n")" }

      - name: Verify macOS signature
        if: runner.os == 'macOS' && env.SIGNING_EXPECTED == '1'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/"MD-Studio Desktop.app")
          if [ ${#apps[@]} -eq 0 ]; then
            echo "release 下没有 .app，无法校验签名" >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q "Authority=Developer ID Application"
            echo "签名有效：$app"
          done

      - name: Verify macOS notarization
        if: runner.os == 'macOS' && env.NOTARIZED == '1'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/"MD-Studio Desktop.app")
          for app in "${apps[@]}"; do
            # 票据必须已经 staple 进 .app，否则离线机器上 Gatekeeper 仍会询问 Apple
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
            echo "公证通过：$app"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installers
          path: |
            md-studio/release/*.exe
            md-studio/release/*.dmg
            md-studio/release/*.zip
            md-studio/release/*.AppImage
            md-studio/release/*.deb
            md-studio/release/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 该 job 没有 checkout，gh 无法从工作目录推断仓库，必须显式指定
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec gh release upload "$GITHUB_REF_NAME" {} --repo "$GITHUB_REPOSITORY" \;
